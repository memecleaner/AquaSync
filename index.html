<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaSync - Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e252b; /* Diubah dark mode dikit biar senada dengan dashboard */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }

        .logo-placeholder {
            width: 80px;
            border-radius: 50%;
            display: inline-block;
            margin-bottom: 10px;
        }

        h2 {
            color: #333;
            margin: 0 0 10px 0;
            font-weight: 600;
        }

        p {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eef2f2;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
            background-color: #fff;
            color: #333;
        }

        input:focus {
            border-color: #7dd1d7;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #7dd1d7;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #36c2b5;
            transform: translateY(-2px);
        }

        .error-msg {
            color: #ff7675;
            font-size: 13px;
            margin-top: 15px;
            display: none;
            font-weight: 600;
        }

        .footer-links {
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }

        .footer-links a {
            color: #7dd1d7;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-placeholder">
            <img src="logoAS.png" width="80px" alt="">
        </div>
    
        <h2>Welcome back!</h2>
        <p>Please enter your details to access <b>Aquasync</b>.</p>

        <div class="login-form-area">
            <div class="input-group">
                <label for="email">Email Account</label>
                <input type="email" id="email" placeholder="Your account email..." required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Password here" required>
            </div>

            <button id="loginBtn">Log In</button>
        </div>
        
        <div id="errorTxt" class="error-msg">Email atau Password salah!</div>

        <div class="footer-links">
            Forget your Password? <a href="https://wa.me/6285814718630?text=Halo%20Admin,%20saya%20lupa%20password%20akun%20AquaSync" target="_blank">Contact Admin</a>
        </div>
    </div>

    <!-- Di bagian bawah file index.html sebelum tutup tag </body> -->
<script type="module">
    import { inisialisasiLogin } from "./js/auth.js";
    
    // Langsung jalankan fungsi login yang sudah kita rapikan di file terpisah
    inisialisasiLogin();
</script>
</body>
</html>
